[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  # Vite 7 needs Node 20.19+ (or 22.12+). Pinned so an older site setting cannot break the build.
  NODE_VERSION = "22"

# Make the API routes explicit so the SPA fallback below can never swallow a function call.
# Each file in netlify/functions is reachable at /api/<file name>.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
